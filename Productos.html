<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Registro de Productos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">REGISTRO DE PRODUCTOS</h1>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/productos/guardar}"
          th:object="${producto}"
          method="post"
          class="mb-5">

        <input type="hidden" th:field="*{idProducto}">

        <div class="mb-3">

            <label class="form-label">ID Marca:</label>

            <input type="number"
                   th:field="*{idMarca}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">Nombre:</label>

            <input type="text"
                   th:field="*{nombre}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">Precio:</label>

            <input type="number"
                   step="0.01"
                   th:field="*{precio}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">Stock:</label>

            <input type="number"
                   th:field="*{stock}"
                   class="form-control">

        </div>

        <button type="submit" class="btn btn-primary">
            GUARDAR
        </button>

    </form>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>ID MARCA</th>
                <th>NOMBRE</th>
                <th>PRECIO</th>
                <th>STOCK</th>
                <th>ACCIONES</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="p : ${productos}">

                <td th:text="${p.idProducto}"></td>

                <td th:text="${p.idMarca}"></td>

                <td th:text="${p.nombre}"></td>

                <td th:text="${p.precio}"></td>

                <td th:text="${p.stock}"></td>

                <td>

                    <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <form th:action="@{/productos/eliminar/{id}(id=${p.idProducto})}"
                          method="post"
                          style="display:inline;">

                        <button type="submit"
                                class="btn btn-danger btn-sm">
                            Eliminar
                        </button>

                    </form>

                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>
</html>
