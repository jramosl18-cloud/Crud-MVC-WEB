<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Registro de Clientes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">REGISTRO DE CLIENTES</h1>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <!-- Formulario -->
    <form th:action="@{/clientes/guardar}"
          th:object="${cliente}"
          method="post"
          class="mb-5">

        <input type="hidden" th:field="*{idCliente}">

        <div class="mb-3">
            <label class="form-label">NIT:</label>
            <input type="text"
                   th:field="*{nit}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Nombres:</label>
            <input type="text"
                   th:field="*{nombre}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Apellidos:</label>
            <input type="text"
                   th:field="*{apellidos}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email"
                   th:field="*{email}"
                   class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">
            GUARDAR
        </button>

    </form>

    <!-- Tabla de clientes -->
    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>NIT</th>
                <th>NOMBRE</th>
                <th>APELLIDOS</th>
                <th>EMAIL</th>
                <th>ACCIONES</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="c : ${clientes}">

                <td th:text="${c.idCliente}"></td>

                <td th:text="${c.nit}"></td>

                <td th:text="${c.nombre}"></td>

                <td th:text="${c.apellidos}"></td>

                <td th:text="${c.email}"></td>

                <td>

                    <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <form th:action="@{/clientes/eliminar/{id}(id=${c.idCliente})}"
                          method="post"
                          style="display:inline;">

                        <button type="submit"
                                class="btn btn-danger btn-sm">
                            Eliminar
                        </button>

                    </form>

                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>
</html>
